<!doctype html><html><head><meta charset="utf-8"><title>LogAgent Development</title><style>body{margin:0;background:#0f172a;color:#e5e7eb;font:14px system-ui}header{padding:16px 22px;background:#111827;border-bottom:1px solid #263247}main{display:grid;grid-template-columns:260px 1fr 420px;height:calc(100vh - 58px)}aside,section{padding:14px;border-right:1px solid #263247;overflow:auto}textarea{width:100%;height:62%;box-sizing:border-box;background:#020617;color:#dbeafe;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace}button{background:#2563eb;color:white;border:0;border-radius:7px;padding:8px 12px;margin:4px;cursor:pointer}.file{padding:7px;border-radius:5px;cursor:pointer}.file:hover{background:#1e293b}.msg{white-space:pre-wrap;background:#111827;padding:12px;border-radius:8px;margin:8px 0}</style></head><body><header><b>LogAgent</b> / Development / ChatGPT</header><main><aside><h3>Project Files</h3><div id="files">Loading...</div><button onclick="loadFiles()">Refresh</button></aside><section><h3 id="current">Select a file</h3><textarea id="editor"></textarea><div><button onclick="diff()">Show Diff</button><button onclick="apply()">Apply Change</button><button onclick="test()">Run Tests</button></div><pre id="result"></pre></section><section><h3>ChatGPT Development</h3><div id="chat"></div><textarea id="prompt" style="height:150px" placeholder="Ask ChatGPT to inspect, explain, or propose a change..."></textarea><button onclick="ask()">Ask ChatGPT</button><p>Changes are previewed before Apply. Server-side OPENAI_API_KEY is required.</p></section></main><script>let current="";async function j(u,o){let r=await fetch(u,o);return r.json()}async function loadFiles(){let x=await j('/api/development/tree');files.innerHTML=x.map(f=>`<div class=file onclick="openFile('${f.replaceAll("'","\\'")}')">${f}</div>`).join('')}async function openFile(f){current=f;document.getElementById('current').textContent=f;let x=await j('/api/development/file?path='+encodeURIComponent(f));editor.value=x.content}async function diff(){let x=await j('/api/development/diff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current,content:editor.value})});result.textContent=x.diff||'No changes.'}async function apply(){let x=await j('/api/development/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current,content:editor.value,reason:'ChatGPT development UI'})});result.textContent=JSON.stringify(x,null,2);loadFiles()}async function test(){let x=await j('/api/development/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'pytest -q'})});result.textContent=(x.passed?'PASS\n':'FAIL\n')+x.stdout+'\n'+x.stderr}async function ask(){let p=prompt.value;chat.innerHTML+=`<div class=msg><b>You:</b> ${p}</div>`;let x=await j('/api/development/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:p,path:current,content:editor.value})});chat.innerHTML+=`<div class=msg><b>ChatGPT:</b> ${x.text||x.error||JSON.stringify(x)}</div>`}loadFiles()</script></body></html>
