<!doctype html><html><head><meta charset="utf-8"><title>LogAgent Munki Recipe Editor</title><style>body{font-family:system-ui;background:#111827;color:#e5e7eb;margin:0}header{padding:18px 24px;background:#0b1220}main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px}.card{background:#182235;border:1px solid #29364d;border-radius:10px;padding:16px}button{padding:9px 14px;margin:3px;border:0;border-radius:7px;cursor:pointer}textarea{width:100%;height:500px;background:#0b1220;color:#d1d5db;border:1px solid #34445e;border-radius:8px;padding:12px;box-sizing:border-box}input{width:100%;padding:9px;box-sizing:border-box;background:#0b1220;color:#fff;border:1px solid #34445e;border-radius:7px;margin:5px 0}</style></head><body><header><b>LogAgent</b> / Munki Recipe Editor</header><main><section class="card"><h3>Recipe Library</h3><input id="name" placeholder="Recipe filename"><button onclick="validate()">Validate</button><button onclick="save()">Save</button><button onclick="saveAs()">Save As</button><button onclick="pull()">Pull</button><button onclick="push()">Push</button><pre id="status"></pre></section><section class="card"><h3>Recipe JSON / Structured Editor</h3><textarea id="recipe">{}</textarea></section></main><script>const out=()=>document.getElementById('status'),r=()=>JSON.parse(document.getElementById('recipe').value),n=()=>document.getElementById('name').value;async function post(url,body){let x=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await x.json();out().textContent=JSON.stringify(j,null,2);return j}function validate(){return post('/api/munki/validate',r())}function save(){return post('/api/munki/save',{name:n(),recipe:r()})}function saveAs(){let target=prompt('Save As filename',n());if(target)return post('/api/munki/save-as',{source:n(),name:target,recipe:r()})}function pull(){let source=prompt('Local/source recipe path');if(source)post('/api/munki/pull',{source}).then(j=>{if(j.recipe)recipe.value=JSON.stringify(j.recipe,null,2)})}function push(){let destination=prompt('Destination path');if(destination)post('/api/munki/push',{name:n(),destination})}</script></body></html>
